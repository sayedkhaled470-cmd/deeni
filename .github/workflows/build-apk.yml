name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Icons and permissions
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          r='android/app/src/main/res/mipmap-'
          for d,a,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              for n,s,src in [('ic_launcher.png',a,'icon.png'),('ic_launcher_round.png',a,'icon.png'),('ic_launcher_foreground.png',f,'icon-fg.png')]:
                  p=r+d+'/'+n
                  if os.path.exists(p): Image.open(src).convert('RGBA').resize((s,s)).save(p)
          open('android/app/src/main/res/values/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0d0618</color></resources>')
          PY
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deeni-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
