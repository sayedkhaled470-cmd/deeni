name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Icons and permissions
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          res='android/app/src/main/res'
          sizes={'mdpi':(48,108),'hdpi':(72,162),'xhdpi':(96,216),'xxhdpi':(144,324),'xxxhdpi':(192,432)}
          ic=Image.open('icon.png').convert('RGBA')
          fg=Image.open('icon-fg.png').convert('RGBA')
          for d,(a,f) in sizes.items():
              p=res+'/mipmap-'+d
              if not os.path.isdir(p): continue
              for n in ('ic_launcher.png','ic_launcher_round.png'):
                  if os.path.exists(p+'/'+n): ic.resize((a,a),Image.LANCZOS).save(p+'/'+n)
              if os.path.exists(p+'/ic_launcher_foreground.png'): fg.resize((f,f),Image.LANCZOS).save(p+'/ic_launcher_foreground.png')
          bg=res+'/values/ic_launcher_background.xml'
          if os.path.exists(bg):
              open(bg,'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0d0618</color>\n</resources>\n')
          PY
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deeni-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
